<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cape Fear Collective — Editorial wedding photography for couples who want to remember how it actually felt. Based in Wilmington, NC." />
    <title>Cape Fear Collective — Wedding Photography, Wilmington NC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
    <script>
      // Decode redirect from 404.html SPA redirect
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').reduce(function(s, v) {
            var parts = v.split('=');
            if (parts[0] === 'p') s.path = parts[1].replace(/~and~/g, '&');
            if (parts[0] === 'q') s.query = '?' + parts[1].replace(/~and~/g, '&');
            return s;
          }, { path: '', query: '' });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded.path + decoded.query + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
